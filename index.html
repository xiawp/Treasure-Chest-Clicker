<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | TreasureChestClicker</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Сбрасываем всё и растягиваем игру на весь документ */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #unity-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      #unity-canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        margin: 0;
        padding: 0;
        border: 0;
        background: #000;
      }
      /* Всё лишнее визуально скрыто */
      #unity-loading-bar,
      #unity-warning,
      #unity-footer,
      #unity-logo,
      #unity-build-title,
      #unity-fullscreen-button,
      #unity-webgl-logo {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="600"></canvas>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");

      // Никаких визуальных баннеров — только консоль
      function unityShowBanner(msg, type) {
        if (type === 'error') console.error(msg);
        else console.warn(msg);
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/TreasureChestClicker.loader.js";
      var config = {
        dataUrl: buildUrl + "/1972e94c0cdb6817ab1e1ead35379014.data.unityweb",
        frameworkUrl: buildUrl + "/c355dba7a9727f5215e939bd227a8937.js.unityweb",
        codeUrl: buildUrl + "/094d83310c131778bab5600508febf1a.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "SimonEftestol",
        productName: "TreasureChestClicker",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // На мобильных — корректный viewport без предупреждений
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
        // config.devicePixelRatio = 1; // можно включить для производительности
      }

      // Размер канваса всегда равен размеру окна
      function resizeCanvas() {
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          // прогресс загрузки без визуального индикатора
        }).then((unityInstance) => {
          // Двойной клик по канвасу — на весь экран (опционально)
          canvas.addEventListener("dblclick", () => unityInstance.SetFullscreen(1));
        }).catch((message) => {
          console.error(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
